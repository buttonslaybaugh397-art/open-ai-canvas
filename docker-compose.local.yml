services:
  migration-helper:
    image: open-ai-canvas-local-migration-helper:local
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: local-migration-helper
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    environment:
      CANVAS_LOCAL_REPOSITORY_ROOT: /workspace
      CANVAS_LOCAL_SERVICE_URL: http://web:3000
    volumes:
      # The helper runs the platform-specific migration script against the host checkout.
      - type: bind
        source: "${CANVAS_HOST_REPOSITORY_ROOT:-.}"
        target: /workspace
        bind:
          create_host_path: false
      # Docker socket access is required to save/load images and restart local services.
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        bind:
          create_host_path: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9714/healthz"]
      interval: 5s
      timeout: 3s
      start_period: 2s
      retries: 12

  backend:
    image: open-ai-canvas-backend:local
    depends_on:
      migration-helper:
        condition: service_healthy
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: backend
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    environment:
      CANVAS_BACKEND_ADDR: ":8080"
      CANVAS_BACKEND_DATA_DIR: /data
      CANVAS_SHUTDOWN_TIMEOUT: ${CANVAS_SHUTDOWN_TIMEOUT:-10m}
      CANVAS_DATABASE_DRIVER: ${CANVAS_DATABASE_DRIVER:-sqlite}
      DATABASE_URL: ${DATABASE_URL:-}
      REDIS_URL: ${REDIS_URL:-}
      CANVAS_WORKER_CONCURRENCY: ${CANVAS_WORKER_CONCURRENCY:-3}
      CANVAS_CHANNEL_CONCURRENCY: ${CANVAS_CHANNEL_CONCURRENCY:-3}
      CANVAS_REGISTRATION_ENABLED: ${CANVAS_REGISTRATION_ENABLED:-false}
      CANVAS_ALLOW_PRIVATE_UPSTREAMS: ${CANVAS_ALLOW_PRIVATE_UPSTREAMS:-false}
      CANVAS_ALLOWED_PRIVATE_UPSTREAM_HOSTS: ${CANVAS_ALLOWED_PRIVATE_UPSTREAM_HOSTS:-}
      CANVAS_CORS_ORIGINS: ${CANVAS_CORS_ORIGINS:-http://localhost:3000}
      ENABLE_PROVIDER_PLUGINS: ${ENABLE_PROVIDER_PLUGINS:-false}
      CANVAS_UPDATER_URL: http://migration-helper:9714
      CANVAS_UPDATER_TOKEN_FILE: /run/open-ai-canvas-local-migration/token
      GIN_MODE: release
    volumes:
      # Reuse the existing local development database instead of creating a new empty volume.
      - type: bind
        source: "${CANVAS_HOST_REPOSITORY_ROOT:-.}/.local/project-workbench-debug"
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: "${CANVAS_HOST_REPOSITORY_ROOT:-.}/.local/migration-helper"
        target: /run/open-ai-canvas-local-migration
        bind:
          create_host_path: true
        read_only: true
    restart: unless-stopped
    stop_grace_period: ${CANVAS_SHUTDOWN_TIMEOUT:-10m}
    develop:
      watch:
        - action: rebuild
          path: ./backend
          ignore:
            - data/

  web:
    image: open-ai-canvas-web:local
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      migration-helper:
        condition: service_started
      backend:
        condition: service_healthy
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: ./web
          ignore:
            - node_modules/
            - dist/
            - tsconfig.tsbuildinfo
        - action: rebuild
          path: ./Dockerfile
        - action: rebuild
          path: ./nginx.conf
        - action: rebuild
          path: ./VERSION
        - action: rebuild
          path: ./CHANGELOG.md
