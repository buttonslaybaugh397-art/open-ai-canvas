# 1Panel: replace the whole compose content, do not append to an existing file.
# Defaults to this fork's latest published images; set CANVAS_CORS_ORIGINS first.
name: open-ai-canvas

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-open_ai_canvas}
      POSTGRES_USER: ${POSTGRES_USER:-open_ai_canvas}
      CANVAS_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_PASSWORD_FILE: /run/canvas-secrets/postgres-password
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        password_file=/run/canvas-secrets/postgres-password
        database_url_file=/run/canvas-secrets/database-url
        case "$$POSTGRES_DB" in ""|*[!A-Za-z0-9_]*) echo "Invalid POSTGRES_DB: use letters, digits or underscores" >&2; exit 1 ;; esac
        case "$$POSTGRES_USER" in ""|*[!A-Za-z0-9_]*) echo "Invalid POSTGRES_USER: use letters, digits or underscores" >&2; exit 1 ;; esac
        [ "$${#POSTGRES_DB}" -le 63 ] && [ "$${#POSTGRES_USER}" -le 63 ] || { echo "Database and user names must not exceed 63 characters" >&2; exit 1; }
        umask 077
        if [ ! -s "$$password_file" ]; then
          if [ -n "$${CANVAS_POSTGRES_PASSWORD:-}" ]; then
            password="$$CANVAS_POSTGRES_PASSWORD"
          elif [ -s "$$PGDATA/PG_VERSION" ]; then
            echo "Existing PostgreSQL data has no password file. Restore the secrets volume or supply its original POSTGRES_PASSWORD" >&2
            exit 1
          else
            password="$$(od -An -N24 -tx1 /dev/urandom | tr -d ' \n')"
          fi
          [ "$${#password}" -ge 32 ] || { echo "POSTGRES_PASSWORD must have at least 32 characters" >&2; exit 1; }
          case "$$password" in *[!A-Za-z0-9]*) echo "POSTGRES_PASSWORD must contain only letters and digits" >&2; exit 1 ;; esac
          printf '%s' "$$password" > "$$password_file"
        fi
        password="$$(cat "$$password_file")"
        [ "$${#password}" -ge 32 ] || { echo "Persisted PostgreSQL password is invalid" >&2; exit 1; }
        case "$$password" in *[!A-Za-z0-9]*) echo "Persisted PostgreSQL password is invalid" >&2; exit 1 ;; esac
        if [ -n "$${CANVAS_POSTGRES_PASSWORD:-}" ] && [ "$$CANVAS_POSTGRES_PASSWORD" != "$$password" ]; then
          echo "POSTGRES_PASSWORD differs from the persisted password; changing this variable does not rotate an existing database password" >&2
          exit 1
        fi
        printf 'host=postgres port=5432 user=%s password=%s dbname=%s sslmode=disable\n' "$$POSTGRES_USER" "$$password" "$$POSTGRES_DB" > "$$database_url_file"
        chmod 0444 "$$password_file" "$$database_url_file"
        unset CANVAS_POSTGRES_PASSWORD password
        exec docker-entrypoint.sh postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - deployment-secrets:/run/canvas-secrets
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "[ \"$$(redis-cli --raw ping)\" = PONG ]"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 120s
    restart: unless-stopped
    stop_grace_period: 1m

  migrate:
    image: ghcr.io/${CANVAS_IMAGE_OWNER:-buttonslaybaugh397-art}/open-ai-canvas-backend:${CANVAS_IMAGE_TAG:-latest}
    pull_policy: always
    environment:
      CANVAS_BACKEND_DATA_DIR: /data
      CANVAS_DATABASE_DRIVER: postgres
    command:
      - /bin/sh
      - -ec
      - |
        DATABASE_URL="$$(cat /run/canvas-secrets/database-url)"
        [ -n "$$DATABASE_URL" ] || { echo "Database connection file is empty" >&2; exit 1; }
        export DATABASE_URL
        migrate-schema up
        exec migrate-schema verify
    volumes:
      - deployment-secrets:/run/canvas-secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: "no"

  backend:
    image: ghcr.io/${CANVAS_IMAGE_OWNER:-buttonslaybaugh397-art}/open-ai-canvas-backend:${CANVAS_IMAGE_TAG:-latest}
    pull_policy: always
    environment:
      CANVAS_BACKEND_ADDR: ":8080"
      CANVAS_BACKEND_DATA_DIR: /data
      CANVAS_DATABASE_DRIVER: postgres
      CANVAS_AUTO_MIGRATE: "false"
      CANVAS_SHUTDOWN_TIMEOUT: ${CANVAS_SHUTDOWN_TIMEOUT:-10m}
      REDIS_URL: redis://redis:6379/0
      CANVAS_WORKER_CONCURRENCY: ${CANVAS_WORKER_CONCURRENCY:-3}
      CANVAS_CHANNEL_CONCURRENCY: ${CANVAS_CHANNEL_CONCURRENCY:-3}
      CANVAS_REGISTRATION_ENABLED: ${CANVAS_REGISTRATION_ENABLED:-false}
      CANVAS_ALLOW_PRIVATE_UPSTREAMS: "false"
      CANVAS_ALLOWED_PRIVATE_UPSTREAM_HOSTS: ${CANVAS_ALLOWED_PRIVATE_UPSTREAM_HOSTS:-}
      CANVAS_CORS_ORIGINS: ${CANVAS_CORS_ORIGINS:?Set CANVAS_CORS_ORIGINS to the exact browser origin}
      GIN_MODE: release
    command:
      - /bin/sh
      - -ec
      - |
        DATABASE_URL="$$(cat /run/canvas-secrets/database-url)"
        [ -n "$$DATABASE_URL" ] || { echo "Database connection file is empty" >&2; exit 1; }
        export DATABASE_URL
        exec infinite-canvas-backend
    volumes:
      - backend-data:/data
      - deployment-secrets:/run/canvas-secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped
    stop_grace_period: ${CANVAS_SHUTDOWN_TIMEOUT:-10m}

  web:
    image: ghcr.io/${CANVAS_IMAGE_OWNER:-buttonslaybaugh397-art}/open-ai-canvas-web:${CANVAS_IMAGE_TAG:-latest}
    pull_policy: always
    ports:
      - "${CANVAS_BIND_ADDRESS:-127.0.0.1}:${CANVAS_HTTP_PORT:-6868}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

# These defaults match the earlier open-ai-canvas deployment. Verify before updating.
# Point to the actual existing names if your 1Panel project used a different prefix.
volumes:
  backend-data:
    name: ${CANVAS_BACKEND_VOLUME:-open-ai-canvas_backend-data}
  deployment-secrets:
    name: ${CANVAS_SECRETS_VOLUME:-open-ai-canvas_deployment-secrets}
  postgres-data:
    name: ${CANVAS_POSTGRES_VOLUME:-open-ai-canvas_postgres-data}
  redis-data:
    name: ${CANVAS_REDIS_VOLUME:-open-ai-canvas_redis-data}
