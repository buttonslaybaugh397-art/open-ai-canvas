openapi: 3.0.3
info:
  title: 影策 HTTP API
  version: "1.0.0"
  description: |
    路径前缀是 `/api`。前后端一起发布，不按路径做 API 版本。

    业务 JSON 信封为 `{ code, data, msg, reason }`。`code === 0` 表示成功；失败时 HTTP status 与
    `code` 都表达失败。`code` 默认等于 HTTP 状态；同一状态下的细分原因使用 `status*100+n`
    （例如 40301 配额、42901 限流）。机器判断请用 `reason`，不要解析 `msg`。

    TypeScript 调用面仍是 `web/src/services/api` 的 `http` 模块，不从本规范生成客户端。
servers:
  - url: /api
security:
  - sessionCookie: []
tags:
  - name: meta
  - name: auth
  - name: projects
  - name: resources
  - name: tasks
  - name: assets
  - name: admin-storage
  - name: admin-analytics
  - name: admin-users
  - name: agent
  - name: admin
paths:
  /public/welcome:
    get:
      tags: [meta]
      security: []
      summary: 读取欢迎页开放状态
      responses:
        "200":
          description: 信封 data 仅包含 welcomeEnabled 布尔值，默认 true；Cache-Control 为 no-store
        "500":
          description: 配置读取失败
  /agent/capabilities:
    get:
      tags: [agent]
      summary: 读取云端 Agent 能力
      responses:
        "200":
          description: 信封 data 包含 version、permissionModes、contextScopes、skills、writeTools、billing、maxHistoryPairs、maxSteps、maxHistoryBytes、capabilitySetVersion、capabilitySetHash、nodeTypes、tools；maxHistoryPairs 和 maxSteps 为 0 表示无固定轮数上限，历史仍受 maxHistoryBytes 限制
  /agent/profile:
    get:
      tags: [agent]
      summary: 读取生效的用户、项目、画布 Agent 偏好层
      parameters:
        - in: query
          name: scope
          schema:
            type: string
            enum: [user, project, canvas]
        - in: query
          name: projectId
          schema:
            type: string
        - in: query
          name: canvasId
          schema:
            type: string
      responses:
        "200":
          description: 信封 data 为合并 revision、hash 和按 user/project/canvas 顺序排列的 layers；每层含独立数字 revision
        "403":
          description: 项目或画布不属于当前用户
    patch:
      tags: [agent]
      summary: 使用单层 revision CAS 更新 Agent 偏好
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentProfileRequest"
      responses:
        "200":
          description: 返回更新后的生效偏好视图
        "409":
          description: 偏好 revision 已变化，须重新读取后保存
  /agent/runs:
    post:
      tags: [agent]
      summary: 创建一轮云端 Agent 任务
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloudAgentRequest"
      responses:
        "200":
          description: 信封 data.run，包含新一轮 id、canvasId、status、permissionMode、model 及时间
        "400":
          description: 参数、能力、模型或预算不符合要求，未创建任务
        "409":
          description: 幂等键已用于不同请求
  /agent/runs/{id}:
    parameters:
      - $ref: "#/components/parameters/AgentRunID"
    get:
      tags: [agent]
      summary: 读取当前用户的 Agent 轮次
      responses:
        "200":
          description: 信封 data.run
        "404":
          description: 轮次不存在或不属于当前用户
  /agent/runs/{id}/messages:
    parameters:
      - $ref: "#/components/parameters/AgentRunID"
    post:
      tags: [agent]
      summary: 从服务端父轮历史创建新轮次
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloudAgentRequest"
      responses:
        "200":
          description: 信封 data.run（新的 ID）
        "409":
          description: 父轮仍在执行或幂等键冲突
  /agent/runs/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/AgentRunID"
    post:
      tags: [agent]
      summary: 取消当前用户的 Agent 轮次
      responses:
        "200":
          description: 信封 data.accepted
  /agent/runs/{id}/undo:
    parameters:
      - $ref: "#/components/parameters/AgentRunID"
    post:
      tags: [agent]
      summary: 撤销当前 Agent 运行产生的最新画布变更
      description: 仅撤销仍是最新快照、且未提交生成任务的画布变更；不会取消任务或退款。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedSnapshotHash]
              properties:
                stepId:
                  type: string
                  maxLength: 160
                expectedSnapshotHash:
                  type: string
                  minLength: 64
                  maxLength: 64
                  pattern: '^[0-9a-fA-F]{64}$'
                reason:
                  type: string
                  maxLength: 2000
      responses:
        "200":
          description: 信封 data.accepted 与当前快照哈希
        "400":
          description: 请求无效、快照不可撤销或已提交任务不能撤销
        "409":
          description: 画布已发生后续变化、操作已处理或 stepId 不匹配
  /agent/runs/{id}/approvals/{approvalId}/decision:
    parameters:
      - $ref: "#/components/parameters/AgentRunID"
      - name: approvalId
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [agent]
      summary: 提交 Agent 工具审批决定
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approve, reject]
                reason:
                  type: string
                  maxLength: 2000
                mediaSettings:
                  type: object
                  additionalProperties: false
                  description: 仅 approve 图片生成审批可传；替换本次模型、画幅和质量，重新强校验，不修改提示词、引用或目标。logicalModelId 与 channelId + channelModelKey 二选一。
                  required: [size, quality]
                  properties:
                    logicalModelId:
                      type: string
                    channelId:
                      type: string
                    channelModelKey:
                      type: string
                    size:
                      type: string
                    quality:
                      type: string
      responses:
        "200":
          description: 信封 data.accepted
        "409":
          description: 审批不存在、已过期或决定冲突
  /agent/runs/{id}/events:
    parameters:
      - $ref: "#/components/parameters/AgentRunID"
    get:
      tags: [agent]
      summary: Agent 运行事件回放与持续订阅
      parameters:
        - name: after
          in: query
          schema:
            type: integer
            minimum: 0
        - name: Last-Event-ID
          in: header
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: 首次及 revision 变化时发送紧凑 run_snapshot；无变化时 heartbeat；agent_event.seq 为递增游标，cleanupPending 期间持续发送
          content:
            text/event-stream:
              schema:
                type: string
  /openapi.yaml:
    get:
      tags: [meta]
      security: []
      summary: 本 OpenAPI 文档
      responses:
        "200":
          description: OpenAPI 3.0 YAML
          content:
            application/yaml:
              schema:
                type: string
  /admin/channels/{id}/duplicate:
    post:
      tags: [admin]
      summary: 复制系统渠道
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /auth/session:
    get:
      tags: [auth]
      summary: 当前登录会话
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "401":
          $ref: "#/components/responses/Error"
  /auth/login:
    post:
      tags: [auth]
      security: []
      summary: 登录并设置会话 Cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "401":
          $ref: "#/components/responses/Error"
  /auth/display-name:
    patch:
      tags: [auth]
      summary: 当前用户修改自己的显示名称
      description: |
        仅接受 displayName，拒绝登录用户名、用户 ID、角色、密码等额外字段。账号取自登录 Cookie。
        去除首尾空白后须为 1-40 个 Unicode 字符，支持中文及同名，不允许换行和控制字符。
        返回 data.user，保留公开第三方身份；不更换登录用户名、用户 ID、密码、积分、历史数据或会话。
        修改与 user.display_name.update_self 审计同事务；相同名称不重复写入。每账号每 10 分钟限 10 次请求。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [displayName]
              properties:
                displayName:
                  type: string
                  description: 去除首尾空白后须为 1-40 个字符，不含换行或控制字符
      responses:
        "200": { $ref: "#/components/responses/Envelope" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /admin/users/{id}:
    patch:
      tags: [admin-users]
      summary: 管理员修改用户资料和登录用户名
      description: |
        username 可省略，省略时不变。提供时去除首尾空白，并校验 3-32 位字母、数字、下划线或连字符；
        不允许与其他账号的用户名重复（忽略大小写）。仅改名不改变用户 ID、积分、历史数据或现有会话。
        同时修改密码会撤销现有会话。资料修改及审计写入在同一事务中完成。
        管理员可只提交 password 来找回账号，无需旧密码；密码至少 8 个字符、UTF-8 最多 72 字节。
        不返回密码明文或哈希，不改变积分和历史记录；重置本人密码时清除会话 Cookie。
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: 去除首尾空白后匹配 ^[A-Za-z0-9_-]{3,32}$
                displayName: { type: string }
                email: { type: string }
                password: { type: string, writeOnly: true }
                role: { type: string, enum: [admin, user] }
                status: { type: string, enum: [active, disabled] }
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /projects:
    get:
      tags: [projects]
      summary: 短剧项目列表
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      tags: [projects]
      summary: 创建短剧项目
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          $ref: "#/components/responses/Error"
  /resources:
    get:
      tags: [resources]
      summary: 当前用户资源列表
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
    post:
      tags: [resources]
      summary: 上传资源文件
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "403":
          description: 配额用尽（code=40301, reason=quota_exceeded）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /resources/{id}/file:
    get:
      tags: [resources]
      summary: 解析 CDN 地址或读取资源
      description: 校验归属后，云端资源只使用 CDN，失败返回 503，proxy/direct 不允许绕过 CDN；仅本地资源返回文件流。resolve=1 返回包含 data.url 的 JSON 信封，本地资源的 url 为空。
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: resolve
          schema: { type: string, enum: ["1"] }
          description: 只解析读取地址，不传输媒体；签名地址禁止持久化。
      responses:
        "200":
          description: 本地文件流，或 resolve=1 时的 JSON 信封（data.url 为 CDN 地址或空字符串）。
        "206":
          description: 本地文件部分内容
        "307":
          description: CDN 跳转；签名跳转禁止缓存。
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /tasks:
    post:
      tags: [tasks]
      summary: 创建生成任务
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          $ref: "#/components/responses/Error"
  /tasks/{id}/text-events:
    get:
      tags: [tasks]
      summary: 文本任务 SSE
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: after
          schema: { type: integer }
          description: 递增事件游标，不要用任务 ID
      responses:
        "200":
          description: text/event-stream
  /assets:
    get:
      tags: [assets]
      summary: 用户素材库
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
  /admin/resources/{id}/file:
    get:
      tags: [admin-storage]
      summary: 管理员解析 CDN 地址、预览或下载资源
      description: 校验管理员权限后按资源所属用户的存储配置交付。云端资源只使用 CDN，缺少 CDN 或不可用时返回 503；仅本地资源返回文件流。resolve=1 返回包含 data.url 的 JSON 信封，本地资源的 url 为空。
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: direct
          schema: { type: string, enum: ["1"] }
          description: 不绕过 CDN 交付策略，不签发源站回退地址。
        - in: query
          name: proxy
          schema: { type: string, enum: ["1"] }
          description: 不再启用云端媒体代理，仍使用 CDN 交付策略。
        - in: query
          name: resolve
          schema: { type: string, enum: ["1"] }
          description: 只解析读取地址，不传输媒体；签名地址禁止持久化。
        - in: query
          name: download
          schema: { type: string, enum: ["1"] }
        - in: query
          name: filename
          schema: { type: string }
          description: 下载文件名；七牛 CDN 通过签名 attname 设置，本地文件通过 Content-Disposition 设置。
        - in: header
          name: Range
          schema: { type: string }
      responses:
        "200":
          description: 本地文件流，或 resolve=1 时的 JSON 信封（data.url 为 CDN 地址或空字符串）。
        "206":
          description: 部分文件流
        "307":
          description: CDN 跳转；签名跳转禁止缓存。
          headers:
            Location:
              schema: { type: string, format: uri }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /admin/settings/oss/credentials:
    get:
      tags: [admin-storage]
      summary: 显式读取当前平台对象存储凭据
      description: |
        仅管理员可调用。成功响应包含当前厂商的 AccessKey ID、SecretKey 和可选 Session Token，
        响应禁止缓存并记录不含明文的管理员审计事件。普通存储设置接口始终保持脱敏。
      responses:
        "200":
          description: 当前平台对象存储凭据信封
          headers:
            Cache-Control:
              schema: { type: string, example: "private, no-store" }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [credentials]
                        properties:
                          credentials: { $ref: "#/components/schemas/AdminOSSCredentials" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409":
          description: 数据库密文与当前 `.settings-key` 不匹配，旧凭据不可恢复
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "429": { $ref: "#/components/responses/Error" }
  /admin/analytics/overview:
    get:
      tags: [admin-analytics]
      summary: 管理员用量统计总览
      description: |
        返回 KPI、逐日趋势、模型、渠道、逐用户和失败分类。任务、逻辑上游请求与已结算账单采用独立事实口径；
        成功媒体只按任务计一次，轮询和下载不计为逻辑请求。用户行包含 models、channels、daily 三组个人明细。
      parameters:
        - $ref: "#/components/parameters/AnalyticsFrom"
        - $ref: "#/components/parameters/AnalyticsTo"
        - $ref: "#/components/parameters/AnalyticsUserID"
        - $ref: "#/components/parameters/AnalyticsModel"
        - $ref: "#/components/parameters/AnalyticsChannelID"
        - $ref: "#/components/parameters/AnalyticsCapability"
      responses:
        "200":
          description: 统计总览信封，data 为 AnalyticsOverview
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AnalyticsOverview" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/analytics/models:
    get:
      tags: [admin-analytics]
      summary: 管理员模型用量明细
      parameters:
        - $ref: "#/components/parameters/AnalyticsFrom"
        - $ref: "#/components/parameters/AnalyticsTo"
        - $ref: "#/components/parameters/AnalyticsUserID"
        - $ref: "#/components/parameters/AnalyticsModel"
        - $ref: "#/components/parameters/AnalyticsChannelID"
        - $ref: "#/components/parameters/AnalyticsCapability"
      responses:
        "200":
          description: data.models 为按逻辑模型和能力聚合的 AnalyticsModelRow 数组
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/analytics/channels:
    get:
      tags: [admin-analytics]
      summary: 管理员渠道用量明细
      parameters:
        - $ref: "#/components/parameters/AnalyticsFrom"
        - $ref: "#/components/parameters/AnalyticsTo"
        - $ref: "#/components/parameters/AnalyticsUserID"
        - $ref: "#/components/parameters/AnalyticsModel"
        - $ref: "#/components/parameters/AnalyticsChannelID"
        - $ref: "#/components/parameters/AnalyticsCapability"
      responses:
        "200":
          description: data.channels 为按最终归属渠道聚合的 AnalyticsChannelRow 数组
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/analytics/users:
    get:
      tags: [admin-analytics]
      summary: 管理员逐用户用量明细
      description: |
        data.users 中每位用户都有完整总账，并继续拆分 models、channels 和 daily；data.dau、data.wau、data.mau
        是截至筛选结束时间的滚动活跃人数。零任务但有登录或创作活动的用户仍会出现。
      parameters:
        - $ref: "#/components/parameters/AnalyticsFrom"
        - $ref: "#/components/parameters/AnalyticsTo"
        - $ref: "#/components/parameters/AnalyticsUserID"
        - $ref: "#/components/parameters/AnalyticsModel"
        - $ref: "#/components/parameters/AnalyticsChannelID"
        - $ref: "#/components/parameters/AnalyticsCapability"
      responses:
        "200":
          description: 逐用户统计以及 DAU、WAU、MAU
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/analytics/export.csv:
    get:
      tags: [admin-analytics]
      summary: 导出逐用户完整统计 CSV
      description: 每位用户一行，UTF-8 BOM；模型、渠道和每日明细以 JSON 列保留，筛选参数与总览一致。
      parameters:
        - $ref: "#/components/parameters/AnalyticsFrom"
        - $ref: "#/components/parameters/AnalyticsTo"
        - $ref: "#/components/parameters/AnalyticsUserID"
        - $ref: "#/components/parameters/AnalyticsModel"
        - $ref: "#/components/parameters/AnalyticsChannelID"
        - $ref: "#/components/parameters/AnalyticsCapability"
      responses:
        "200":
          description: CSV 文件流
          content:
            text/csv:
              schema: { type: string, format: binary }
        "403": { $ref: "#/components/responses/Error" }
components:
  parameters:
    AnalyticsFrom:
      in: query
      name: from
      schema: { type: string, format: date }
      description: 起始自然日（含）；缺省为结束日前 30 天，最长统计 366 天。
    AnalyticsTo:
      in: query
      name: to
      schema: { type: string, format: date }
      description: 结束自然日（含）；服务端查询内部转换为次日零点的开区间。
    AnalyticsUserID:
      in: query
      name: userId
      schema: { type: string }
      description: 精确筛选用户 ID。
    AnalyticsModel:
      in: query
      name: model
      schema: { type: string }
      description: 精确筛选归一后的逻辑模型。
    AnalyticsChannelID:
      in: query
      name: channelId
      schema: { type: string }
      description: 精确筛选最终归属渠道 ID。
    AnalyticsCapability:
      in: query
      name: capability
      schema: { type: string, enum: [text, image, video, audio] }
      description: 筛选生成能力。
    AgentRunID:
      name: id
      in: path
      required: true
      schema:
        type: string
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: open_ai_canvas_session
  schemas:
    AgentProfileRequest:
      type: object
      additionalProperties: false
      required: [scope, content, revision]
      properties:
        scope:
          type: string
          enum: [user, project, canvas]
        projectId:
          type: string
        canvasId:
          type: string
        content:
          type: string
          description: 常驻偏好文档，最多 12000 个 Unicode 字符；不能授权节点、工具、预算或绕过审批
        revision:
          type: integer
          minimum: 0
          description: 待更新层的数字 revision；首次创建为 0
    CloudAgentRequest:
      type: object
      additionalProperties: false
      required: [canvasId, prompt, permissionMode, contextScope, budget, idempotencyKey]
      properties:
        canvasId:
          type: string
          maxLength: 80
        prompt:
          type: string
          description: 非空，最多 16000 字节
        logicalModelId:
          type: string
        model:
          type: string
        channelId:
          type: string
        channelModelKey:
          type: string
        permissionMode:
          type: string
          enum: [read_only, request_approval, auto]
        reasoningMode:
          type: string
          enum: [off, auto, deep]
          description: 本轮推理策略；供应商是否支持由后端校验
        profileRevision:
          type: string
          description: GET /agent/profile 的生效合并 revision；变化时拒绝创建新轮次
        skillIds:
          type: array
          maxItems: 8
          items:
            type: string
        contextScope:
          type: array
          maxItems: 1
          items:
            type: string
            enum: [canvas]
        budget:
          type: object
          additionalProperties: false
          required: [maxCredits]
          properties:
            maxCredits:
              type: number
              minimum: 0
              exclusiveMinimum: true
              maximum: 1000000
            maxGenerationTasks:
              type: integer
              minimum: 0
              maximum: 8
            maxVideoSeconds:
              type: integer
              minimum: 0
              maximum: 120
        idempotencyKey:
          type: string
          minLength: 8
          maxLength: 128
    Envelope:
      type: object
      required: [code, msg]
      properties:
        code:
          type: integer
          description: 0 成功；失败时默认等于 HTTP 状态，或 status*100+n 的细分码
        data: {}
        msg:
          type: string
        reason:
          type: string
          description: 仅失败时出现。稳定机器可读原因。
    ErrorEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            code:
              type: integer
              enum: [400, 401, 403, 404, 409, 429, 500, 502, 503, 504, 40301, 40901, 42901]
            data:
              nullable: true
            reason:
              type: string
              enum:
                - invalid_argument
                - unauthorized
                - forbidden
                - not_found
                - conflict
                - failed_precondition
                - quota_exceeded
                - rate_limited
                - unavailable
                - timeout
                - internal
                - bad_gateway
                - model_capability_not_supported
                - model_price_not_configured
                - model_route_unavailable
                - provider_request_failed
                - model_catalog_mismatch
                - invalid_model_selection
    AdminOSSCredentials:
      type: object
      required: [provider, accessKeyId, accessKeySecret, sessionToken]
      properties:
        provider: { type: string, enum: [aliyun, tencent, qiniu, s3] }
        accessKeyId: { type: string }
        accessKeySecret: { type: string, format: password, writeOnly: false }
        sessionToken: { type: string, format: password, writeOnly: false }
    AnalyticsOverview:
      type: object
      required: [from, to, kpi, trend, models, channels, users, failures]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time, description: 开区间结束时间 }
        kpi: { $ref: "#/components/schemas/AnalyticsKPI" }
        trend:
          type: array
          items: { $ref: "#/components/schemas/AnalyticsTrendPoint" }
        models:
          type: array
          items: { $ref: "#/components/schemas/AnalyticsDimensionRow" }
        channels:
          type: array
          items: { $ref: "#/components/schemas/AnalyticsDimensionRow" }
        users:
          type: array
          items: { $ref: "#/components/schemas/AnalyticsUserRow" }
        failures:
          type: array
          items: { type: object }
    AnalyticsKPI:
      allOf:
        - $ref: "#/components/schemas/AnalyticsUsageMetrics"
        - type: object
          properties:
            activeUsers: { type: integer }
            dau: { type: integer }
            wau: { type: integer }
            mau: { type: integer }
            generationTasks: { type: integer }
            averageTaskDurationMs: { type: integer, format: int64 }
            currentQueuedTasks: { type: integer, format: int64 }
    AnalyticsTrendPoint:
      allOf:
        - $ref: "#/components/schemas/AnalyticsUsageMetrics"
        - type: object
          properties:
            day: { type: string, format: date }
            activeUsers: { type: integer }
    AnalyticsDimensionRow:
      allOf:
        - $ref: "#/components/schemas/AnalyticsUsageMetrics"
        - type: object
          properties:
            model: { type: string }
            capability: { type: string }
            channelId: { type: string }
            name: { type: string }
            uniqueUsers: { type: integer }
            uniqueModels: { type: integer }
    AnalyticsUserRow:
      allOf:
        - $ref: "#/components/schemas/AnalyticsUsageMetrics"
        - type: object
          required: [userId, name, models, channels, daily]
          properties:
            userId: { type: string }
            name: { type: string }
            activeDays: { type: integer }
            loginCount: { type: integer }
            firstActiveAt: { type: string, format: date-time }
            lastActiveAt: { type: string, format: date-time }
            averageTaskDurationMs: { type: integer, format: int64 }
            p95TaskDurationMs: { type: integer, format: int64 }
            agentMessages: { type: integer }
            canvasDays: { type: integer }
            assets: { type: integer }
            resources: { type: integer }
            commonModel: { type: string }
            models:
              type: array
              items: { $ref: "#/components/schemas/AnalyticsDimensionRow" }
            channels:
              type: array
              items: { $ref: "#/components/schemas/AnalyticsDimensionRow" }
            daily:
              type: array
              items:
                allOf:
                  - $ref: "#/components/schemas/AnalyticsUsageMetrics"
                  - type: object
                    properties:
                      day: { type: string, format: date }
                      loginCount: { type: integer }
                      agentMessages: { type: integer }
                      canvasActive: { type: boolean }
                      assets: { type: integer }
                      resources: { type: integer }
    AnalyticsUsageMetrics:
      type: object
      description: 所有字段均为当前筛选区间和当前维度内的值；费用微单位仅在 costAvailable=true 时有效。
      properties:
        tasks: { type: integer }
        textTasks: { type: integer }
        imageTasks: { type: integer }
        videoTasks: { type: integer }
        audioTasks: { type: integer }
        succeededTasks: { type: integer }
        failedTasks: { type: integer }
        cancelledTasks: { type: integer }
        queuedTasks: { type: integer }
        runningTasks: { type: integer }
        taskSuccessRate: { type: number, format: double }
        requests: { type: integer }
        upstreamRequests: { type: integer }
        succeededRequests: { type: integer }
        failedRequests: { type: integer }
        requestSuccessRate: { type: number, format: double }
        successRate: { type: number, format: double }
        p50DurationMs: { type: integer, format: int64 }
        p95DurationMs: { type: integer, format: int64 }
        p95RequestDurationMs: { type: integer, format: int64 }
        mediaCount: { type: integer }
        generatedImages: { type: integer }
        generatedVideos: { type: integer }
        generatedAudio: { type: integer }
        videoSeconds: { type: integer }
        inputTokens: { type: integer, format: int64 }
        outputTokens: { type: integer, format: int64 }
        cachedTokens: { type: integer, format: int64 }
        usageAvailable: { type: boolean }
        creditsConsumedMicrocredits: { type: integer, format: int64 }
        estimatedCostMicros: { type: integer, format: int64 }
        costAvailable: { type: boolean }
        currency: { type: string }
  responses:
    Envelope:
      description: 业务成功信封
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
    Error:
      description: 业务失败信封
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
