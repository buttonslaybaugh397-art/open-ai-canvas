openapi: 3.0.3
info:
  title: 影策 HTTP API
  version: "1.0.0"
  description: |
    路径前缀是 `/api`。前后端一起发布，不按路径做 API 版本。

    业务 JSON 信封为 `{ code, data, msg, reason }`。`code === 0` 表示成功；失败时 HTTP status 与
    `code` 都表达失败。`code` 默认等于 HTTP 状态；同一状态下的细分原因使用 `status*100+n`
    （例如 40301 配额、42901 限流）。机器判断请用 `reason`，不要解析 `msg`。

    TypeScript 调用面仍是 `web/src/services/api` 的 `http` 模块，不从本规范生成客户端。
servers:
  - url: /api
security:
  - sessionCookie: []
tags:
  - name: meta
  - name: auth
  - name: projects
  - name: resources
  - name: tasks
  - name: assets
  - name: admin-storage
  - name: admin-analytics
  - name: admin-users
paths:
  /openapi.yaml:
    get:
      tags: [meta]
      security: []
      summary: 本 OpenAPI 文档
      responses:
        "200":
          description: OpenAPI 3.0 YAML
          content:
            application/yaml:
              schema:
                type: string
  /auth/session:
    get:
      tags: [auth]
      summary: 当前登录会话
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "401":
          $ref: "#/components/responses/Error"
  /auth/login:
    post:
      tags: [auth]
      security: []
      summary: 登录并设置会话 Cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "401":
          $ref: "#/components/responses/Error"
  /auth/display-name:
    patch:
      tags: [auth]
      summary: 当前用户修改自己的显示名称
      description: |
        仅接受 displayName，拒绝登录用户名、用户 ID、角色、密码等额外字段。账号取自登录 Cookie。
        去除首尾空白后须为 1-40 个 Unicode 字符，支持中文及同名，不允许换行和控制字符。
        返回 data.user，保留公开第三方身份；不更换登录用户名、用户 ID、密码、积分、历史数据或会话。
        修改与 user.display_name.update_self 审计同事务；相同名称不重复写入。每账号每 10 分钟限 10 次请求。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [displayName]
              properties:
                displayName:
                  type: string
                  description: 去除首尾空白后须为 1-40 个字符，不含换行或控制字符
      responses:
        "200": { $ref: "#/components/responses/Envelope" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /admin/users/{id}:
    patch:
      tags: [admin-users]
      summary: 管理员修改用户资料和登录用户名
      description: |
        username 可省略，省略时不变。提供时去除首尾空白，并校验 3-32 位字母、数字、下划线或连字符；
        不允许与其他账号的用户名重复（忽略大小写）。仅改名不改变用户 ID、积分、历史数据或现有会话。
        同时修改密码会撤销现有会话。资料修改及审计写入在同一事务中完成。
        管理员可只提交 password 来找回账号，无需旧密码；密码至少 8 个字符、UTF-8 最多 72 字节。
        不返回密码明文或哈希，不改变积分和历史记录；重置本人密码时清除会话 Cookie。
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: 去除首尾空白后匹配 ^[A-Za-z0-9_-]{3,32}$
                displayName: { type: string }
                email: { type: string }
                password: { type: string, writeOnly: true }
                role: { type: string, enum: [admin, user] }
                status: { type: string, enum: [active, disabled] }
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /admin/users/{id}/detail:
    get:
      tags: [admin-users]
      summary: 管理员读取用户详情
      description: |
        storedFileBytes 为资源原件和会话附件实测占用，不是累计上传量。
        文件核验最多等待 3 秒；不可用时 storedFileBytes 为 null，fileStorageError 提供状态提示，
        不用零或数据库声明大小冒充实测值，不影响其他详情字段。dailyUploadBytes 保持 UTC 当日累计上传口径。
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Envelope" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /projects:
    get:
      tags: [projects]
      summary: 短剧项目列表
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      tags: [projects]
      summary: 创建短剧项目
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          $ref: "#/components/responses/Error"
  /resources:
    get:
      tags: [resources]
      summary: 当前用户资源列表
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
    post:
      tags: [resources]
      summary: 上传资源文件
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "403":
          description: 配额用尽（code=40301, reason=quota_exceeded）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /resources/storage-usage:
    get:
      tags: [resources]
      summary: 核算当前账号文件实际占用
      description: |
        账号取自登录 Cookie。按物理存储身份去重后，核实资源原件和会话附件的实际字节数。
        包含回收站、失败上传留下的文件及尚未物理删除的 outbox 文件；明确不存在的对象计零。
        不含播放缓存、临时分片、未归属文件和结构化 JSON，不能用于替代服务器磁盘统计。
        普通读取允许最多 30 秒云端元数据缓存；refresh=1 强制回源。checkedAt 是最早观测时间。
        不删除文件、不改写资源记录，核验失败返回错误而非部分总量或零。
        每账号每分钟最多 30 次读取，其中强制重算最多 6 次；一次核算最长 30 秒。
      parameters:
        - in: query
          name: refresh
          schema: { type: integer, enum: [0, 1], default: 0 }
      responses:
        "200":
          description: 当前账号实测容量，usedBytes 为三个分项之和；单位为字节
          content:
            application/json:
              schema:
                type: object
                required: [code, data, msg]
                properties:
                  code: { type: integer, enum: [0] }
                  msg: { type: string }
                  data:
                    type: object
                    required: [usage]
                    properties:
                      usage:
                        type: object
                        required: [usedBytes, totalBytes, resourceBytes, sessionBytes, pendingDeletionBytes, checkedAt]
                        properties:
                          usedBytes: { type: integer, format: int64, minimum: 0 }
                          totalBytes: { type: integer, format: int64, minimum: 1 }
                          resourceBytes: { type: integer, format: int64, minimum: 0 }
                          sessionBytes: { type: integer, format: int64, minimum: 0 }
                          pendingDeletionBytes: { type: integer, format: int64, minimum: 0 }
                          checkedAt: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /resources/{id}/repair-references:
    post:
      tags: [resources]
      summary: 原子修复当前用户素材和画布中的失效资源引用
      description: 原资源必须不存在或属于当前用户且状态为 failed/deleted；替换资源必须属于当前用户且 ready。仅改写指定媒体字段中的完整引用，保留 JSON 和数据库更新时间。无匹配记录和重复调用均成功，无资源删除或改写。按 AssetWritePerMinute 对账号限流。
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [replacementResourceId]
              properties:
                replacementResourceId: { type: string, minLength: 1 }
      responses:
        "200":
          description: 原子修复成功或幂等无操作
          content:
            application/json:
              schema:
                type: object
                required: [code, data, msg]
                properties:
                  code: { type: integer, enum: [0] }
                  data:
                    type: object
                    required: [repaired]
                    properties:
                      repaired: { type: boolean, enum: [true] }
                  msg: { type: string }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: 资源状态不允许修复，或文档/资源发生并发变更；无部分写入
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /resources/{id}/playback:
    post:
      tags: [resources]
      summary: 按需创建视频兼容播放副本
      description: 仅本人 ready 视频；空/none 抢占一次转码，ready/processing/failed 复用。无请求体。失败状态属于资源处理结果，返回 data.resource.playbackStatus=failed，不自动重试。
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: 返回当前资源及播放适配状态
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, enum: [0] }
                  data:
                    type: object
                    properties:
                      resource:
                        type: object
                        properties:
                          id: { type: string }
                          playbackStatus: { type: string, enum: [processing, ready, failed] }
                          playbackObjectKey: { type: string }
                          playbackError: { type: string }
                  msg: { type: string }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          description: 账号频控或全局转码并发已满，携带 Retry-After
        "503":
          $ref: "#/components/responses/Error"
  /resources/{id}/file:
    get:
      tags: [resources]
      summary: 读取资源二进制（非 JSON 信封）
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: variant
          schema: { type: string, enum: [playback] }
          description: ready 播放副本优先于云端重定向；支持 Range 和独立 ETag
        - in: query
          name: download
          description: 设置为 1 时以附件流式下载原件，即使同时指定 variant=playback
          schema: { type: string, enum: ["1"] }
        - in: query
          name: filename
          description: 可选附件文件名，仅 download=1 时使用
          schema: { type: string }
        - in: query
          name: direct
          description: 设置为 1 请求直连；附件下载仅对支持附件签名的存储直连
          schema: { type: string, enum: ["1"] }
        - in: query
          name: proxy
          description: 设置为 1 强制同源资源流
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: 文件流
        "206":
          description: Range 部分文件流
        "307":
          description: 禁止缓存的短时签名资源重定向
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /tasks:
    post:
      tags: [tasks]
      summary: 创建生成任务
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          $ref: "#/components/responses/Error"
  /tasks/{id}/query-provider:
    post:
      tags: [tasks]
      summary: 查询失败视频任务并恢复原任务轮询或结果
      description: 仅查询已存在的上游任务；仍在处理时恢复持久化轮询，不重新提交或预占计费。
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/ProviderTaskRecovery"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /admin/api-logs/{id}/query-task:
    post:
      tags: [admin-analytics]
      summary: 管理员查询并恢复失败视频任务
      description: 要求管理员权限及日志与任务归属一致，复用用户任务恢复合同并记录审计。
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/ProviderTaskRecovery"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /tasks/{id}/text-events:
    get:
      tags: [tasks]
      summary: 文本任务 SSE
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: after
          schema: { type: integer }
          description: 递增事件游标，不要用任务 ID
      responses:
        "200":
          description: text/event-stream
  /assets:
    get:
      tags: [assets]
      summary: 用户素材库
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
  /admin/settings/oss/credentials:
    get:
      tags: [admin-storage]
      summary: 显式读取当前平台对象存储凭据
      description: |
        仅管理员可调用。成功响应包含当前厂商的 AccessKey ID、SecretKey 和可选 Session Token，
        响应禁止缓存并记录不含明文的管理员审计事件。普通存储设置接口始终保持脱敏。
      responses:
        "200":
          description: 当前平台对象存储凭据信封
          headers:
            Cache-Control:
              schema: { type: string, example: "private, no-store" }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [credentials]
                        properties:
                          credentials: { $ref: "#/components/schemas/AdminOSSCredentials" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409":
          description: 数据库密文与当前 `.settings-key` 不匹配，旧凭据不可恢复
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "429": { $ref: "#/components/responses/Error" }
  /admin/analytics/overview:
    get:
      tags: [admin-analytics]
      summary: 管理员用量统计总览
      description: |
        返回 KPI、逐日趋势、模型、渠道、逐用户和失败分类。任务、逻辑上游请求与已结算账单采用独立事实口径；
        成功媒体只按任务计一次，轮询和下载不计为逻辑请求。用户行包含 models、channels、daily 三组个人明细。
      parameters:
        - $ref: "#/components/parameters/AnalyticsFrom"
        - $ref: "#/components/parameters/AnalyticsTo"
        - $ref: "#/components/parameters/AnalyticsUserID"
        - $ref: "#/components/parameters/AnalyticsModel"
        - $ref: "#/components/parameters/AnalyticsChannelID"
        - $ref: "#/components/parameters/AnalyticsCapability"
      responses:
        "200":
          description: 统计总览信封，data 为 AnalyticsOverview
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AnalyticsOverview" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/analytics/models:
    get:
      tags: [admin-analytics]
      summary: 管理员模型用量明细
      parameters:
        - $ref: "#/components/parameters/AnalyticsFrom"
        - $ref: "#/components/parameters/AnalyticsTo"
        - $ref: "#/components/parameters/AnalyticsUserID"
        - $ref: "#/components/parameters/AnalyticsModel"
        - $ref: "#/components/parameters/AnalyticsChannelID"
        - $ref: "#/components/parameters/AnalyticsCapability"
      responses:
        "200":
          description: data.models 为按逻辑模型和能力聚合的 AnalyticsModelRow 数组
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/analytics/channels:
    get:
      tags: [admin-analytics]
      summary: 管理员渠道用量明细
      parameters:
        - $ref: "#/components/parameters/AnalyticsFrom"
        - $ref: "#/components/parameters/AnalyticsTo"
        - $ref: "#/components/parameters/AnalyticsUserID"
        - $ref: "#/components/parameters/AnalyticsModel"
        - $ref: "#/components/parameters/AnalyticsChannelID"
        - $ref: "#/components/parameters/AnalyticsCapability"
      responses:
        "200":
          description: data.channels 为按最终归属渠道聚合的 AnalyticsChannelRow 数组
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/analytics/users:
    get:
      tags: [admin-analytics]
      summary: 管理员逐用户用量明细
      description: |
        data.users 中每位用户都有完整总账，并继续拆分 models、channels 和 daily；data.dau、data.wau、data.mau
        是截至筛选结束时间的滚动活跃人数。零任务但有登录或创作活动的用户仍会出现。
      parameters:
        - $ref: "#/components/parameters/AnalyticsFrom"
        - $ref: "#/components/parameters/AnalyticsTo"
        - $ref: "#/components/parameters/AnalyticsUserID"
        - $ref: "#/components/parameters/AnalyticsModel"
        - $ref: "#/components/parameters/AnalyticsChannelID"
        - $ref: "#/components/parameters/AnalyticsCapability"
      responses:
        "200":
          description: 逐用户统计以及 DAU、WAU、MAU
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/analytics/export.csv:
    get:
      tags: [admin-analytics]
      summary: 导出逐用户完整统计 CSV
      description: 每位用户一行，UTF-8 BOM；模型、渠道和每日明细以 JSON 列保留，筛选参数与总览一致。
      parameters:
        - $ref: "#/components/parameters/AnalyticsFrom"
        - $ref: "#/components/parameters/AnalyticsTo"
        - $ref: "#/components/parameters/AnalyticsUserID"
        - $ref: "#/components/parameters/AnalyticsModel"
        - $ref: "#/components/parameters/AnalyticsChannelID"
        - $ref: "#/components/parameters/AnalyticsCapability"
      responses:
        "200":
          description: CSV 文件流
          content:
            text/csv:
              schema: { type: string, format: binary }
        "403": { $ref: "#/components/responses/Error" }
components:
  parameters:
    AnalyticsFrom:
      in: query
      name: from
      schema: { type: string, format: date }
      description: 起始自然日（含）；缺省为结束日前 30 天，最长统计 366 天。
    AnalyticsTo:
      in: query
      name: to
      schema: { type: string, format: date }
      description: 结束自然日（含）；服务端查询内部转换为次日零点的开区间。
    AnalyticsUserID:
      in: query
      name: userId
      schema: { type: string }
      description: 精确筛选用户 ID。
    AnalyticsModel:
      in: query
      name: model
      schema: { type: string }
      description: 精确筛选归一后的逻辑模型。
    AnalyticsChannelID:
      in: query
      name: channelId
      schema: { type: string }
      description: 精确筛选最终归属渠道 ID。
    AnalyticsCapability:
      in: query
      name: capability
      schema: { type: string, enum: [text, image, video, audio] }
      description: 筛选生成能力。
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: open_ai_canvas_session
  schemas:
    ProviderTaskQueryResult:
      type: object
      required: [task, providerStatus, recovered, pollingResumed, billingSettled]
      properties:
        task:
          type: object
          properties:
            id: { type: string }
            status: { type: string, enum: [running, succeeded] }
            providerRecoveryAt: { type: string, format: date-time }
          additionalProperties: true
        providerStatus: { type: string }
        recovered: { type: boolean, description: 已保存成功结果 }
        pollingResumed: { type: boolean, description: 已恢复原上游任务的自动轮询 }
        billingSettled: { type: boolean, description: 本次恢复成功且已结算 }
    Envelope:
      type: object
      required: [code, msg]
      properties:
        code:
          type: integer
          description: 0 成功；失败时默认等于 HTTP 状态，或 status*100+n 的细分码
        data: {}
        msg:
          type: string
        reason:
          type: string
          description: 仅失败时出现。稳定机器可读原因。
    ErrorEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            code:
              type: integer
              enum: [400, 401, 403, 404, 409, 429, 500, 502, 503, 504, 40301, 40901, 42901]
            data:
              nullable: true
            reason:
              type: string
              enum:
                - invalid_argument
                - unauthorized
                - forbidden
                - not_found
                - conflict
                - failed_precondition
                - quota_exceeded
                - rate_limited
                - unavailable
                - timeout
                - internal
                - bad_gateway
                - model_capability_not_supported
                - model_price_not_configured
                - model_route_unavailable
                - provider_request_failed
                - model_catalog_mismatch
                - invalid_model_selection
    AdminOSSCredentials:
      type: object
      required: [provider, accessKeyId, accessKeySecret, sessionToken]
      properties:
        provider: { type: string, enum: [aliyun, tencent, qiniu, s3] }
        accessKeyId: { type: string }
        accessKeySecret: { type: string, format: password, writeOnly: false }
        sessionToken: { type: string, format: password, writeOnly: false }
    AnalyticsOverview:
      type: object
      required: [from, to, kpi, trend, models, channels, users, failures]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time, description: 开区间结束时间 }
        kpi: { $ref: "#/components/schemas/AnalyticsKPI" }
        trend:
          type: array
          items: { $ref: "#/components/schemas/AnalyticsTrendPoint" }
        models:
          type: array
          items: { $ref: "#/components/schemas/AnalyticsDimensionRow" }
        channels:
          type: array
          items: { $ref: "#/components/schemas/AnalyticsDimensionRow" }
        users:
          type: array
          items: { $ref: "#/components/schemas/AnalyticsUserRow" }
        failures:
          type: array
          items: { type: object }
    AnalyticsKPI:
      allOf:
        - $ref: "#/components/schemas/AnalyticsUsageMetrics"
        - type: object
          properties:
            activeUsers: { type: integer }
            dau: { type: integer }
            wau: { type: integer }
            mau: { type: integer }
            generationTasks: { type: integer }
            averageTaskDurationMs: { type: integer, format: int64 }
            currentQueuedTasks: { type: integer, format: int64 }
    AnalyticsTrendPoint:
      allOf:
        - $ref: "#/components/schemas/AnalyticsUsageMetrics"
        - type: object
          properties:
            day: { type: string, format: date }
            activeUsers: { type: integer }
    AnalyticsDimensionRow:
      allOf:
        - $ref: "#/components/schemas/AnalyticsUsageMetrics"
        - type: object
          properties:
            model: { type: string }
            capability: { type: string }
            channelId: { type: string }
            name: { type: string }
            uniqueUsers: { type: integer }
            uniqueModels: { type: integer }
    AnalyticsUserRow:
      allOf:
        - $ref: "#/components/schemas/AnalyticsUsageMetrics"
        - type: object
          required: [userId, name, models, channels, daily]
          properties:
            userId: { type: string }
            name: { type: string }
            activeDays: { type: integer }
            loginCount: { type: integer }
            firstActiveAt: { type: string, format: date-time }
            lastActiveAt: { type: string, format: date-time }
            averageTaskDurationMs: { type: integer, format: int64 }
            p95TaskDurationMs: { type: integer, format: int64 }
            agentMessages: { type: integer }
            canvasDays: { type: integer }
            assets: { type: integer }
            resources: { type: integer }
            commonModel: { type: string }
            models:
              type: array
              items: { $ref: "#/components/schemas/AnalyticsDimensionRow" }
            channels:
              type: array
              items: { $ref: "#/components/schemas/AnalyticsDimensionRow" }
            daily:
              type: array
              items:
                allOf:
                  - $ref: "#/components/schemas/AnalyticsUsageMetrics"
                  - type: object
                    properties:
                      day: { type: string, format: date }
                      loginCount: { type: integer }
                      agentMessages: { type: integer }
                      canvasActive: { type: boolean }
                      assets: { type: integer }
                      resources: { type: integer }
    AnalyticsUsageMetrics:
      type: object
      description: 所有字段均为当前筛选区间和当前维度内的值；费用微单位仅在 costAvailable=true 时有效。
      properties:
        tasks: { type: integer }
        textTasks: { type: integer }
        imageTasks: { type: integer }
        videoTasks: { type: integer }
        audioTasks: { type: integer }
        succeededTasks: { type: integer }
        failedTasks: { type: integer }
        cancelledTasks: { type: integer }
        queuedTasks: { type: integer }
        runningTasks: { type: integer }
        taskSuccessRate: { type: number, format: double }
        requests: { type: integer }
        upstreamRequests: { type: integer }
        succeededRequests: { type: integer }
        failedRequests: { type: integer }
        requestSuccessRate: { type: number, format: double }
        successRate: { type: number, format: double }
        p50DurationMs: { type: integer, format: int64 }
        p95DurationMs: { type: integer, format: int64 }
        p95RequestDurationMs: { type: integer, format: int64 }
        mediaCount: { type: integer }
        generatedImages: { type: integer }
        generatedVideos: { type: integer }
        generatedAudio: { type: integer }
        videoSeconds: { type: integer }
        inputTokens: { type: integer, format: int64 }
        outputTokens: { type: integer, format: int64 }
        cachedTokens: { type: integer, format: int64 }
        usageAvailable: { type: boolean }
        creditsConsumedMicrocredits: { type: integer, format: int64 }
        estimatedCostMicros: { type: integer, format: int64 }
        costAvailable: { type: boolean }
        currency: { type: string }
  responses:
    ProviderTaskRecovery:
      description: 原任务已恢复自动轮询或成功结果
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ProviderTaskQueryResult"
    Envelope:
      description: 业务成功信封
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
    Error:
      description: 业务失败信封
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
